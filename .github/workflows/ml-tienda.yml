name: ml-tienda

# LA TIENDA PÚBLICA A MANO (30/10/2026, él: "que corra ahora el robot para cargar la web"): lo mismo que los dos pasos
# "Tienda pública" y "Subir la tienda a la web" de ml-daily, sin el resto de la noche (no manda resúmenes ni toca precios).

on:
  workflow_dispatch:
    inputs:
      forzar:
        # Revisión de la tienda (30/10/2026): si la lista nueva tiene menos del 75% de los productos de la publicada no se sube (una falla
        # no deja la tienda casi vacía). Cuando la baja es a propósito (reglas nuevas que sacan muchos), se tilda esto.
        description: 'Subir aunque la lista nueva tenga menos del 75% de los productos de la publicada'
        type: boolean
        required: false
        default: false

concurrency:
  group: ml-tienda
  cancel-in-progress: false

jobs:
  tienda:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tienda pública
        timeout-minutes: 30
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          TIENDA_ARCHIVO: ${{ runner.temp }}/tienda/productos.json
          BILLING_PROBE: tienda;go
        run: node ml-sync/sync.mjs | tee "$RUNNER_TEMP/tienda.log"; exit ${PIPESTATUS[0]}
        shell: bash
      # 🏬 LA TIENDA DIRECTO A SU REPO (08/11/2026): igual que en ml-daily (ml-sync/tienda_subir.sh; sin el secreto TIENDA_TOKEN no hace nada).
      - name: Subir la tienda directo
        id: tiendadirecto
        continue-on-error: true
        timeout-minutes: 30
        env:
          TIENDA_TOKEN: ${{ secrets.TIENDA_TOKEN }}
          FORZAR: ${{ inputs.forzar }}
        run: bash ml-sync/tienda_subir.sh "$RUNNER_TEMP/tienda/productos.json" "$([ "$FORZAR" = true ] && echo forzar)"
      - name: Subir la tienda a la web
        if: ${{ !(steps.tiendadirecto.outputs.directo == 'ok' && steps.tiendadirecto.outputs.traer == 'no') }}
        timeout-minutes: 30
        env:
          ARCHIVO: ${{ runner.temp }}/tienda/productos.json
          RAMA_WEB: claude/add-folder-78ysyb
          FORZAR: ${{ inputs.forzar }}
        run: |
          if [ ! -s "$ARCHIVO" ]; then echo "La tienda no dejó archivo: no subo nada."; exit 1; fi
          AHORA=$(jq '.productos | length' "$ARCHIVO" 2>/dev/null || echo 0)
          if [ "${AHORA:-0}" -lt 1 ]; then echo "La lista nueva no se puede leer o está vacía: no subo nada."; exit 1; fi
          git config user.name  "robot-cyc"
          git config user.email "robot-cyc@users.noreply.github.com"
          DIR="$RUNNER_TEMP/web"
          for i in 1 2 3; do
            rm -rf "$DIR"; git worktree prune
            git fetch --depth=1 origin "$RAMA_WEB" || { echo "no pude bajar la rama (intento $i)"; sleep 5; continue; }
            # Menos del 75% de lo publicado = algo falló (ML, la base): no se sube y el paso sale con error (salvo "forzar").
            ANTES=$(git show FETCH_HEAD:tienda/productos.json 2>/dev/null | jq '.productos | length' 2>/dev/null || echo 0)
            # 09/11/2026 (control diario): el freno ya no corta el paso entero: la Tienda queda como estaba pero ABEL (las perfumerías) se sube
            # igual con su propio freno del 75% (la noche del 09/11 la Tienda bajó a 1.126 por los 2 días y ABEL quedó un día atrasado).
            SOLO_ABEL=0
            if [ "${ANTES:-0}" -gt 0 ] && [ $((AHORA * 4)) -lt $((ANTES * 3)) ] && [ "$FORZAR" != "true" ]; then
              echo "La lista nueva tiene $AHORA productos y la publicada $ANTES (menos del 75%): la Tienda no la subo (sí ABEL). Si la baja es a propósito, correr ml-tienda con forzar."; SOLO_ABEL=1
            fi
            git worktree add --detach "$DIR" FETCH_HEAD
            mkdir -p "$DIR/tienda"; [ "$SOLO_ABEL" = 1 ] || cp "$ARCHIVO" "$DIR/tienda/productos.json"
            # 📋 detalles de ML (31/10/2026): 64 archivos chicos; si la corrida no los dejó, quedan los de antes.
            if [ "$SOLO_ABEL" != 1 ] && [ -d "$(dirname "$ARCHIVO")/detalles" ]; then rm -rf "$DIR/tienda/detalles"; cp -r "$(dirname "$ARCHIVO")/detalles" "$DIR/tienda/detalles"; fi
            # 🌸 ABEL (01/11/2026): el catálogo de perfumes de las Perfumerías Abel.
            AB_N=$(jq '.productos | length' "$(dirname "$ARCHIVO")/abel/productos.json" 2>/dev/null || echo 0); AB_A=$(git show FETCH_HEAD:tienda/abel/productos.json 2>/dev/null | jq '.productos | length' 2>/dev/null || echo 0)
            if [ "${AB_A:-0}" -gt 0 ] && [ $((${AB_N:-0} * 4)) -lt $((AB_A * 3)) ]; then echo "ABEL nuevo tiene $AB_N perfumes y el publicado $AB_A (menos del 75%): ABEL no lo subo."; rm -f "$(dirname "$ARCHIVO")/abel/productos.json"; fi
            if [ -s "$(dirname "$ARCHIVO")/abel/productos.json" ]; then mkdir -p "$DIR/tienda/abel"; cp "$(dirname "$ARCHIVO")/abel/productos.json" "$DIR/tienda/abel/productos.json"; fi
            cd "$DIR"
            git add tienda/productos.json; [ -d tienda/detalles ] && git add tienda/detalles; [ -d tienda/abel ] && git add tienda/abel
            if git diff --cached --quiet; then echo "La tienda quedó igual: no hay nada para subir."; [ "$SOLO_ABEL" = 1 ] && exit 1; exit 0; fi
            git commit -q -m "Tienda: lista de productos $(TZ=America/Argentina/Buenos_Aires date '+%d-%m-%Y %H:%M')"
            git push origin "HEAD:$RAMA_WEB" && { if [ "$SOLO_ABEL" = 1 ]; then echo "✓ ABEL subido a $RAMA_WEB (la Tienda quedó como estaba)"; exit 1; fi; echo "✓ tienda subida a $RAMA_WEB"; exit 0; }
            cd "$GITHUB_WORKSPACE"
            echo "no pude subir la tienda (intento $i), reintento"
            sleep 5
          done
          echo "No pude subir la tienda."
          exit 1
      # SE VUELVE A LANZAR SOLA HASTA TERMINAR (31/10/2026): el `schedule` de GitHub no corrió ni una vez en 3 horas. Si la corrida dice
      # "quedan N" con N > 0, se pide la siguiente (`workflow_dispatch` lanzado desde acá sí arranca otra). Cuando quede en 0, para sola.
      - name: Seguir si quedan por buscar
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Q=$(grep -o 'quedan [0-9]*' "$RUNNER_TEMP/tienda.log" | tail -1 | grep -o '[0-9]*' || echo 0)
          echo "quedan: ${Q:-0}"
          # revisión etapa 10 (07/11/2026): si ML falló seguido, no se relanza (si no, cada corrida terminaba con "quedan N" y lanzaba otra sin parar)
          if grep -q 'veces seguidas: se cortó' "$RUNNER_TEMP/tienda.log"; then echo "→ ML falló seguido: no lanzo otra (sigue la noche)"; exit 0; fi
          if [ "${Q:-0}" -gt 0 ]; then gh workflow run ml-tienda.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" && echo "→ lancé la siguiente"; else echo "→ terminó: no lanzo otra"; fi
