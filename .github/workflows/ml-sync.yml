name: ml-sync

# Robot que trae las ventas nuevas de ML al panel.
# Corre solo: un ciclo largo que sincroniza cada 2 minutos (ver abajo) + comandos a mano.

on:
  schedule:
    # El cron ya NO define cada cuánto se sincroniza: solo se encarga de que siempre haya un ciclo
    # vivo (el ciclo de abajo dura casi 6 horas y sincroniza cada 2 minutos). Alcanza con que
    # dispare una vez cada 6 horas; se pide 3 veces por hora para que, si un ciclo se cae, arranque
    # otro enseguida. Los disparos de más no molestan: se ponen en cola, nunca cortan al que corre.
    # A propósito en minutos 7/27/47 y no en el 0: en el minuto 0 se juntan los crons de medio
    # GitHub y es cuando más demora.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo prueba (no escribe nada): poné 1'
        required: false
        default: ''
      catalog_only:
        description: 'Solo mostrar el catálogo (debug): poné 1'
        required: false
        default: ''
      clean_vp:
        description: 'Limpiar ventas: dejar solo confiables de N meses (ej 12)'
        required: false
        default: ''
      dump_sinvin:
        description: 'Diagnosticar ventas sin producto: poné 1'
        required: false
        default: ''
      autolink_ignored:
        description: 'Vincular publicaciones ignoradas con ventas: poné 1'
        required: false
        default: ''
      telegram_test:
        description: 'Mandar mensaje de prueba a Telegram: poné 1'
        required: false
        default: ''
      billing_probe:
        description: 'Buscar cargos de ML (almacenamiento Full/publicidad): poné 1 (con account)'
        required: false
        default: ''
      dump_order:
        description: 'Investigar una venta puntual (nº de venta)'
        required: false
        default: ''
      resync_vp:
        description: 'Re-sincronizar ventas al producto de su publicación: poné 1'
        required: false
        default: ''
      dump_fullstock:
        description: 'Ver stock Full (disponible + en camino) de un producto (palabra clave)'
        required: false
        default: ''
      fill_gastos:
        description: 'Crear gasto $800.000 en meses con ventas y sin gastos: poné 1'
        required: false
        default: ''
      purge_before:
        description: 'Arrancar de cero: borrar ventas antes de (ej 2026_01_01), congelando AFIP'
        required: false
        default: ''
      backup_vp:
        description: 'Backup de todas las ventas: poné 1'
        required: false
        default: ''
      purge_vp:
        description: 'Borrar todas las ventas (necesita backup): poné 1'
        required: false
        default: ''
      restore_vp:
        description: 'Restaurar ventas desde el backup: poné 1'
        required: false
        default: ''
      account:
        description: 'Procesar solo una cuenta (ej: Matias)'
        required: false
        default: ''
      backfill_days:
        description: 'Reprocesar los últimos N días (backfill): ej 31'
        required: false
        default: ''
      dump_ventas:
        description: 'Volcar resumen de ventas cargadas (debug): poné 1'
        required: false
        default: ''
      dump_prodneto:
        description: 'Neto real de las ventas de un producto (palabra clave)'
        required: false
        default: ''
      month_neto:
        description: 'Cruzar neto del mes vs MP real (YYYY_MM, ej 2026_06)'
        required: false
        default: ''
      cancel_agg:
        description: 'Recalcular facturación de canceladas (días, ej 400)'
        required: false
        default: ''
      dump_costs:
        description: 'Cuánto te queda por venta según precio (días, ej 90)'
        required: false
        default: ''
      backfill_reclamos:
        description: 'Cargar reclamos/pérdidas históricos (días, ej 365)'
        required: false
        default: ''
      fill_gestfull:
        description: 'Estimar gestión de Full por producto (días, ej 90)'
        required: false
        default: ''
      purge_gastos:
        description: 'Borrar gastos anteriores a (ej 2026_01_01)'
        required: false
        default: ''
  # schedule:
  #   - cron: '*/20 * * * *'   # cada 20 min (se activa al final)

# UN SOLO grupo para todo: nunca puede haber dos corridas a la vez, ni automáticas ni a mano.
# Es obligatorio: cada corrida renueva el token de ML y guarda el nuevo. Si dos lo hacen juntas,
# la segunda usa un token que la primera ya quemó y esa cuenta se saltea sin avisar. En un comando
# que escribe precios, eso sería una cuenta entera sin aplicar.
#
# cancel-in-progress solo para las corridas A MANO: un comando tuyo tiene prioridad y corta el
# ciclo automático (que se recupera solo en el próximo disparo, como mucho 20 minutos). Al revés
# nunca: una corrida automática JAMÁS corta un comando a mano, se queda esperando a que termine.
concurrency:
  group: ml-sync
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # el ciclo dura 340; GitHub corta los jobs a las 6 h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sincronizar ventas
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CATALOG_ONLY: ${{ github.event.inputs.catalog_only }}
          CLEAN_VP: ${{ github.event.inputs.clean_vp }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
          DUMP_VENTAS: ${{ github.event.inputs.dump_ventas }}
          DUMP_PRODNETO: ${{ github.event.inputs.dump_prodneto }}
          DUMP_SINVIN: ${{ github.event.inputs.dump_sinvin }}
          AUTOLINK_IGNORED: ${{ github.event.inputs.autolink_ignored }}
          TELEGRAM_TEST: ${{ github.event.inputs.telegram_test }}
          BILLING_PROBE: ${{ github.event.inputs.billing_probe }}
          DUMP_ORDER: ${{ github.event.inputs.dump_order }}
          RESYNC_VP: ${{ github.event.inputs.resync_vp }}
          DUMP_FULLSTOCK: ${{ github.event.inputs.dump_fullstock }}
          FILL_GASTOS: ${{ github.event.inputs.fill_gastos }}
          PURGE_BEFORE: ${{ github.event.inputs.purge_before }}
          MONTH_NETO: ${{ github.event.inputs.month_neto }}
          CANCEL_AGG: ${{ github.event.inputs.cancel_agg }}
          DUMP_COSTS: ${{ github.event.inputs.dump_costs }}
          BACKFILL_RECLAMOS: ${{ github.event.inputs.backfill_reclamos }}
          FILL_GESTFULL: ${{ github.event.inputs.fill_gestfull }}
          PURGE_GASTOS: ${{ github.event.inputs.purge_gastos }}
          BACKUP_VP: ${{ github.event.inputs.backup_vp }}
          PURGE_VP: ${{ github.event.inputs.purge_vp }}
          RESTORE_VP: ${{ github.event.inputs.restore_vp }}
          ACCOUNT: ${{ github.event.inputs.account }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            # Corrida a mano (un probe): se ejecuta una sola vez y listo.
            node ml-sync/sync.mjs
            exit $?
          fi
          # Corrida automática: no termina enseguida, se queda dando vueltas casi 6 horas (el máximo
          # que deja GitHub para un job). Cuanto más larga, menos depende de que el cron sea puntual.
          #
          # Cada vuelta trae ventas (tarda ~25 s) y después espera 2 minutos → el panel nunca está
          # más de ~2 minutos atrasado.
          #
          # El robot de PRECIOS no corre en todas las vueltas: solo en la 1ª y después una por hora.
          # Traer ventas es leer; tocar precios es escribir en ML, y hacerlo 720 veces por día en vez
          # de 14 es buscarse un problema con las publicaciones que quedan justo en el piso.
          #
          # Si una vuelta falla, se avisa y sigue: un error puntual no corta el resto.
          fin=$(( $(date +%s) + 340*60 ))
          vuelta=0
          while [ "$(date +%s)" -lt "$fin" ]; do
            vuelta=$((vuelta+1))
            hora=$(TZ=America/Argentina/Buenos_Aires date '+%H:%M:%S')
            if [ $(( (vuelta - 1) % 30 )) -eq 0 ]; then
              echo "───── vuelta $vuelta · $hora · ventas + PRECIOS ─────"
              node ml-sync/sync.mjs || echo "⚠️ esta vuelta falló, sigo con la próxima"
            else
              echo "───── vuelta $vuelta · $hora · solo ventas ─────"
              SKIP_PRICES=1 node ml-sync/sync.mjs || echo "⚠️ esta vuelta falló, sigo con la próxima"
            fi
            [ "$(date +%s)" -lt "$fin" ] || break
            sleep 120
          done
          echo "Fin del ciclo: $vuelta sincronizaciones."
