name: ml-sync

# Robot que trae las ventas nuevas de ML al panel.
# Corre solo cada 10 min (GitHub a veces lo demora unos minutos más) + manual.

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos (automático, sin PC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo prueba (no escribe nada): poné 1'
        required: false
        default: ''
      catalog_only:
        description: 'Solo mostrar el catálogo (debug): poné 1'
        required: false
        default: ''
      dump_map:
        description: 'Volcar el mapa de vinculaciones (debug): poné 1'
        required: false
        default: ''
      dump_sinvin:
        description: 'Diagnosticar ventas sin producto: poné 1'
        required: false
        default: ''
      autolink_ignored:
        description: 'Vincular publicaciones ignoradas con ventas: poné 1'
        required: false
        default: ''
      telegram_test:
        description: 'Mandar mensaje de prueba a Telegram: poné 1'
        required: false
        default: ''
      dump_unmapped:
        description: 'Listar sin vincular por ventas (debug): poné 1'
        required: false
        default: ''
      dump_order:
        description: 'Investigar una venta puntual (nº de venta)'
        required: false
        default: ''
      dump_vars:
        description: 'Ver variantes de productos (palabra clave, ej: paulvic)'
        required: false
        default: ''
      autolink:
        description: 'Auto-vincular Paulvic + Victoria (con variantes): poné 1'
        required: false
        default: ''
      dump_history:
        description: 'Ver cuántas ventas hay para traer de ML: poné 1'
        required: false
        default: ''
      dump_count:
        description: 'Contar cuántas trae el método por fechas (días, ej 365)'
        required: false
        default: ''
      backup_vp:
        description: 'Backup de todas las ventas: poné 1'
        required: false
        default: ''
      purge_vp:
        description: 'Borrar todas las ventas (necesita backup): poné 1'
        required: false
        default: ''
      restore_vp:
        description: 'Restaurar ventas desde el backup: poné 1'
        required: false
        default: ''
      account:
        description: 'Procesar solo una cuenta (ej: Matias)'
        required: false
        default: ''
      backfill_days:
        description: 'Reprocesar los últimos N días (backfill): ej 31'
        required: false
        default: ''
      dump_ventas:
        description: 'Volcar resumen de ventas cargadas (debug): poné 1'
        required: false
        default: ''
      dump_prodneto:
        description: 'Neto real de las ventas de un producto (palabra clave)'
        required: false
        default: ''
      dump_recon:
        description: 'Reconciliar ML vs app por cuenta (días, ej 365)'
        required: false
        default: ''
      cancel_agg:
        description: 'Recalcular facturación de canceladas (días, ej 400)'
        required: false
        default: ''
      dump_costs:
        description: 'Cuánto te queda por venta según precio (días, ej 90)'
        required: false
        default: ''
      backfill_reclamos:
        description: 'Cargar reclamos/pérdidas históricos (días, ej 365)'
        required: false
        default: ''
      fill_gestfull:
        description: 'Estimar gestión de Full por producto (días, ej 90)'
        required: false
        default: ''
      backfill_numventa:
        description: 'Pasar el nº de venta al que muestra ML/pack_id (días, ej 365)'
        required: false
        default: ''
  # schedule:
  #   - cron: '*/20 * * * *'   # cada 20 min (se activa al final)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sincronizar ventas
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CATALOG_ONLY: ${{ github.event.inputs.catalog_only }}
          DUMP_MAP: ${{ github.event.inputs.dump_map }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
          DUMP_VENTAS: ${{ github.event.inputs.dump_ventas }}
          DUMP_PRODNETO: ${{ github.event.inputs.dump_prodneto }}
          DUMP_SINVIN: ${{ github.event.inputs.dump_sinvin }}
          AUTOLINK_IGNORED: ${{ github.event.inputs.autolink_ignored }}
          TELEGRAM_TEST: ${{ github.event.inputs.telegram_test }}
          DUMP_UNMAPPED: ${{ github.event.inputs.dump_unmapped }}
          DUMP_ORDER: ${{ github.event.inputs.dump_order }}
          DUMP_VARS: ${{ github.event.inputs.dump_vars }}
          AUTOLINK: ${{ github.event.inputs.autolink }}
          DUMP_HISTORY: ${{ github.event.inputs.dump_history }}
          DUMP_COUNT: ${{ github.event.inputs.dump_count }}
          DUMP_RECON: ${{ github.event.inputs.dump_recon }}
          CANCEL_AGG: ${{ github.event.inputs.cancel_agg }}
          DUMP_COSTS: ${{ github.event.inputs.dump_costs }}
          BACKFILL_RECLAMOS: ${{ github.event.inputs.backfill_reclamos }}
          FILL_GESTFULL: ${{ github.event.inputs.fill_gestfull }}
          BACKFILL_NUMVENTA: ${{ github.event.inputs.backfill_numventa }}
          BACKUP_VP: ${{ github.event.inputs.backup_vp }}
          PURGE_VP: ${{ github.event.inputs.purge_vp }}
          RESTORE_VP: ${{ github.event.inputs.restore_vp }}
          ACCOUNT: ${{ github.event.inputs.account }}
        run: node ml-sync/sync.mjs
