name: ml-pycat

# EL CATÁLOGO DE PARAGUAY MEDIDO CONTRA ML (15/10/2026). El chat de compras copia el catálogo de Nissei a
# `mlapi/pycat` (comando `pycat`) y esto lo busca en el catálogo de ML y le mide el margen, de a 700 por vuelta (era 300, 16/10/2026),
# cada 2 horas (era 3). 18/10/2026: cada HORA. GitHub atrasa el reloj y con cada 2 h salían ~5 vueltas por día (~3.500);
# como cada vuelta dura ~40 min y no se pisan (concurrency), por hora salen más. Lo que da el piso pasa solo a "Para probar"; lo demás queda guardado y escondido.
# NO TOCA NINGÚN PRECIO NI COMPRA NADA. No usa el candado de `ml-sync`, así que no corta el ciclo.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: ml-pycat
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Catálogo de Paraguay contra ML
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BILLING_PROBE: pycatmedir:go
        # exec (etapa 4, 20/10/2026): node (o el ciclo) pasa a ser el proceso del paso y recibe la señal de cancelar de GitHub; antes quedaba huérfano hasta el SIGKILL.
        run: exec node ml-sync/sync.mjs
      # De 02 a 08 (20/10/2026, pedido suyo: "en esas horas nadie mira las ventas, usá el 100%"): si la lista con prioridad no
      # terminó, el robot deja /tmp/pycat_seguir y acá se larga la vuelta siguiente sin esperar al reloj de GitHub.
      - name: Seguir de noche
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/pycat_seguir ]; then gh workflow run ml-pycat.yml --ref "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" && echo "largada la vuelta siguiente"; else echo "nada que seguir"; fi
