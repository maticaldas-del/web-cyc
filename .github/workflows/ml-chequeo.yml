name: ml-chequeo

# El chequeo de la mañana: preguntas sin responder, reclamos abiertos, publicaciones pausadas por
# ML, activas que no son de Full, y el estado de Full (unidades con problema y cajas que llegaron).
# Es la recorrida que se hacía a mano cada mañana.

# SIN horario propio, a propósito. El chequeo lo pide Claude cada mañana a las 10 (hora Argentina)
# desde el chat, lo lee y escribe el resumen ahí mismo. Antes esto corría solo a las 07:45 y lo
# mandaba por Telegram; se sacó porque el resumen se quiere en el chat y no en el celular.
# Queda el botón para dispararlo a mano cuando haga falta.
on:
  workflow_dispatch:
    inputs:
      dias:
        description: 'Días para atrás que mira las cajas de Full (por defecto 7)'
        required: false
        default: '7'

# Comparte el candado con ml-sync porque los dos renuevan los tokens de ML, y dos corridas
# renovando a la vez se pisan: la segunda usa un token que la primera ya quemó, y esa cuenta se
# saltea sin avisar.
#
# cancel-in-progress: true a propósito. El ciclo automático de ventas dura casi 6 horas; si el
# chequeo se pusiera a esperar, no saldría nunca. Así que lo corta, igual que un comando a mano.
# El ciclo se levanta solo en el próximo disparo del cron (como mucho 20 minutos después) y las
# ventas de esos minutos entran igual cuando vuelve: no se pierde ninguna.
concurrency:
  group: ml-sync
  cancel-in-progress: true

jobs:
  chequeo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Hace falta para poder dejar el resultado guardado en el repo (ver el último paso).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Chequeo de la mañana
        env:
          CHEQUEO_ARCHIVO: chequeo/ultimo.txt
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # nomandar = no va a Telegram. El chequeo se lee desde el chat, no desde el celular.
          BILLING_PROBE: chequeo:${{ github.event.inputs.dias || '7' }}:nomandar
        run: node ml-sync/sync.mjs
      # El chequeo queda guardado en el repo. Es para poder leerlo después desde un chat nuevo, que
      # no tiene las claves de ML ni de Firebase y por lo tanto no puede correr el chequeo por su
      # cuenta. El archivo NO lleva números de orden ni el texto de las preguntas: el repo es
      # público. Eso completo va solo a Telegram.
      - name: Guardar el chequeo en el repo
        run: |
          if [ ! -f chequeo/ultimo.txt ]; then
            echo "El chequeo no dejó archivo (habrá fallado antes). No commiteo nada."
            exit 0
          fi
          git config user.name  "robot-cyc"
          git config user.email "robot-cyc@users.noreply.github.com"
          git add chequeo/ultimo.txt
          if git diff --cached --quiet; then
            echo "El chequeo dio igual que el de la corrida anterior: no hay nada para guardar."
            exit 0
          fi
          git commit -m "Chequeo de la mañana $(TZ=America/Argentina/Buenos_Aires date '+%d-%m-%Y %H:%M')"
          # La rama puede haber avanzado mientras corría el chequeo (el robot de precios escribe
          # seguido). Se reintenta con rebase para no pisar nada ni fallar por una carrera.
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "no pude guardar (intento $i), reintento"
            sleep 5
          done
          echo "No pude guardar el chequeo en el repo. El de Telegram salió igual."
