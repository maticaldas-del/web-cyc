name: ml-candidatos

# "PARA PROBAR" TAMBIÉN AL MEDIODÍA (23/09/2026). Pedido suyo: *"no puede hacer 40 al mediodía y 40
# a la noche y termina?"*. `candidatos` mide de a 40 por vuelta (CAND_MAX_ML) y hasta hoy corría
# sólo de noche, así que una tanda nueva tardaba dos noches. Con esta vuelta de las 12:07 (hora
# Argentina) termina en un día.
# Es EL MISMO comando que el de la noche, no una copia: salta lo ya medido y sigue con lo que falta.
# NO TOCA NINGÚN PRECIO NI COMPRA NADA. No usa el candado de `ml-sync`, así que no corta el ciclo.
# 24/10/2026: con los 993 de Elegancia quedaron 2.647 en fila y a ~60 por vuelta (2 por día) tardaba ~3 semanas. Ahora cada 2 horas
# y con 500 consultas por vuelta (~120 medidos): la fila se termina en ~2 días. Dos vueltas no se pisan (concurrency).
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:

concurrency:
  group: ml-candidatos
  cancel-in-progress: false

jobs:
  candidatos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Para probar · candidatos de Paraguay
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BILLING_PROBE: candidatos:max=500:go
        # exec (etapa 4, 20/10/2026): node (o el ciclo) pasa a ser el proceso del paso y recibe la señal de cancelar de GitHub; antes quedaba huérfano hasta el SIGKILL.
        run: exec node ml-sync/sync.mjs
