name: ml-consulta

# UN COMANDO DEL ROBOT SIN CORTAR EL CICLO (26/09/2026).
# ml-sync comparte candado con el ciclo de 2 minutos: cada comando a mano lo corta (o espera a que
# termine). Esto corre en un candado propio, así que sirve para los comandos que SÓLO LEEN, o que
# escriben un renglón chico (vincular, fijarvar), cuando no conviene esperar ni cortar el ciclo.
# Los comandos grandes que escriben mucho (netoweb, avisos, cajasllegaron…) van por ml-sync: si
# corren a la vez que el ciclo pueden pisarse.

on:
  workflow_dispatch:
    inputs:
      comando:
        description: 'El mismo texto que billing_probe de ml-sync'
        required: true
        default: ''

# Sin candado entre consultas: con uno solo, GitHub deja UNA en espera y descarta la anterior.
concurrency:
  group: ml-consulta-${{ github.run_id }}

jobs:
  consulta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Librería de Anthropic (contestar preguntas con IA)
        run: npm install --prefix ml-sync --no-audit --no-fund || echo "No se pudo instalar la IA, el resto sigue"
      - name: Comando
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          MP_TOKEN_MATIAS: ${{ secrets.MP_TOKEN_MATIAS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BILLING_PROBE: ${{ github.event.inputs.comando }}
        # Varios comandos en una corrida, uno por renglón (etapa 6, 14/10/2026): cada uno corre aparte, con su
        # propio chequeo de sólo lectura, y el registro los separa con "##### <comando>". Si uno falla, siguen los
        # demás y la corrida termina en error. Un solo renglón corre igual que antes.
        run: |
          if [ -z "$BILLING_PROBE" ]; then echo "Falta el comando."; exit 1; fi
          # Etapa 4 (20/10/2026): al cancelar, GitHub le manda la señal SÓLO a este bash; `corre` se la pasa a node y
          # lo espera, y no se arranca el comando siguiente (antes node quedaba huérfano hasta el SIGKILL).
          CANCELADO=0
          corre() { "$@" & local h=$! rc=0; trap "CANCELADO=1; kill -INT $h 2>/dev/null; kill -TERM $h 2>/dev/null" INT TERM; while :; do wait $h; rc=$?; kill -0 $h 2>/dev/null || break; done; trap - INT TERM; return $rc; }
          CMDS="$(printf '%s\n' "$BILLING_PROBE" | tr -d '\r' | sed '/^[[:space:]]*$/d')"
          rc=0; n=0
          while IFS= read -r c; do
            n=$((n+1))
            if [ "$c" = "ciclo" ]; then echo "##### ciclo: va por ml-sync, no por ml-consulta"; rc=1; continue; fi
            echo "##### $c"
            if corre env BILLING_PROBE="$c" node ml-sync/sync.mjs; then echo "##### ✓ terminó: $c"; else echo "##### ✗ falló: $c"; rc=1; fi
            if [ "$CANCELADO" = 1 ]; then echo "##### ✋ cancelaron la corrida: no arranco los comandos que faltan"; exit 130; fi
          done <<< "$CMDS"
          echo "##### $n comando(s) · $([ $rc -eq 0 ] && echo 'todos bien' || echo 'alguno falló')"
          exit $rc
