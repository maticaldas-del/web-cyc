name: ml-daily

# Resumen de ventas del día al celular por Telegram.
# Corre solo todas las noches (23:00 ART = 02:00 UTC) + prueba manual.

on:
  schedule:
    # 23:23, 23:41 y 23:53 hora Argentina. Se intenta TRES veces porque GitHub saltea corridas
    # programadas cuando está cargado, y esto corre una sola vez por día: si se saltea, no sale nada
    # (pasó el 27 y 28 de julio). Los minutos son "raros" a propósito: en :00 y :55 hay más cola.
    # El robot guarda el último día enviado, así que las corridas de más no mandan nada repetido.
    - cron: '23 2 * * *'
    - cron: '41 2 * * *'
    - cron: '53 2 * * *'
  workflow_dispatch:
    inputs:
      dia:
        description: 'Día a resumir (YYYY_MM_DD). Vacío = hoy.'
        required: false
        default: ''

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resumen diario
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAILY_SUMMARY: ${{ github.event.inputs.dia != '' && github.event.inputs.dia || '1' }}
        run: node ml-sync/sync.mjs
      # Refresca la facturación de canceladas/devueltas (para el monotributo = "Ventas brutas" ML).
      - name: Facturación de canceladas
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          CANCEL_AGG: '400'
        run: node ml-sync/sync.mjs
      # (El almacenamiento Full y los cargos de ML por débito —IIBB, etc.— ya NO se cargan como gasto
      # mensual: ahora se descuentan como un % por cuenta sobre cada venta, en la web. Ver ML_EXTRA_PCT.)
