name: ml-daily

# Resumen de ventas del día al celular por Telegram.
# Corre solo todas las noches (23:00 ART = 02:00 UTC) + prueba manual.

on:
  schedule:
    # 00:07, 00:21 y 00:43 hora Argentina — YA PASADA LA MEDIANOCHE, a propósito.
    # El robot siempre resume el DÍA ANTERIOR, así que corriendo después de las 00:00 el día que
    # resume es el que acaba de cerrar, con todas sus ventas. Antes corría 23:23 y resumía "hoy",
    # pero GitHub demora las corridas programadas: arrancaban pasada la medianoche y resumían un día
    # recién empezado, sin ventas. Los crons nunca se adelantan, solo se atrasan, así que esto es
    # seguro por más que GitHub demore.
    # Se intenta TRES veces porque GitHub directamente saltea corridas cuando está cargado. Las dos
    # primeras caen dentro del horario permitido (hasta 00:30); si sale la tercera, el mensaje queda
    # encolado y llega a las 10:00. El robot guarda el último día enviado: no manda repetido.
    - cron: '7 3 * * *'
    - cron: '21 3 * * *'
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      dia:
        description: 'Día a resumir (YYYY_MM_DD). Vacío = hoy.'
        required: false
        default: ''

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resumen diario
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAILY_SUMMARY: ${{ github.event.inputs.dia != '' && github.event.inputs.dia || '1' }}
        run: node ml-sync/sync.mjs
      # Guarda las facturas reales que emitió el facturador de ML, cuenta por cuenta, y marca las
      # ventas que quedaron SIN factura. Va acá y no en el ciclo de 2 minutos porque pide una
      # consulta por venta: una vez por día alcanza y no castiga la API de ML.
      - name: Facturas emitidas
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BILLING_PROBE: facsync:3:go
        run: node ml-sync/sync.mjs
      # Recalcula el neto de cada producto al precio que tiene HOY en ML y lo carga en "Margen ML".
      # Va acá porque esa pantalla NO lee ML en vivo: muestra lo último que se calculó. Si no se
      # recalcula, después de tocar precios sigue mostrando números viejos que parecen actuales —
      # y así un producto puede figurar arriba del piso estando abajo, o al revés, sin que se note.
      - name: Margen ML al precio de hoy
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          BILLING_PROBE: netoweb
        run: node ml-sync/sync.mjs
      # Trae las visitas de los ultimos 30 dias de cada publicacion y las guarda en cyc/visitas,
      # que es de donde las lee la columna "Lo miran" de Margen ML. Sin este paso la columna se
      # queda con el dato del dia que alguien corrio el probe a mano, y una visita vieja es peor
      # que ninguna: se decide sobre un producto que hace semanas que no se mide.
      # Solo LEE de ML: no toca ningun precio.
      - name: Visitas de las publicaciones
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          BILLING_PROBE: visitas
        run: node ml-sync/sync.mjs
      # Refresca la facturación de canceladas/devueltas (para el monotributo = "Ventas brutas" ML).
      - name: Facturación de canceladas
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          CANCEL_AGG: '400'
        run: node ml-sync/sync.mjs
      # CUÁNDO LLEGÓ CADA VENTA Y CUÁLES VOLVIERON (21/09/2026).
      #
      # ML lo manda adentro del envío (`status_history` y `return_details`) y nunca se guardaba:
      # el panel sabía cuándo se VENDIÓ y no cuándo llegó. Va acá y no en el ciclo de 2 minutos
      # porque pide una consulta por venta, igual que las facturas.
      #
      # NO vuelve a preguntar por una venta ya entregada o devuelta, así que después de la primera
      # corrida son pocas por día. Y NO guarda ni un dato del comprador: el envío trae su nombre,
      # teléfono y dirección, y se leen sólo las fechas.
      - name: Cuándo llegó cada venta
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          BILLING_PROBE: entregas:30:go
        run: node ml-sync/sync.mjs
      # EL AVISO DE QUÉ SUBIR Y QUÉ BAJAR, al canal privado de Telegram (13/09/2026).
      #
      # Va ACÁ, al final y no al principio, porque necesita el "Margen ML al precio de hoy" ya
      # recalculado: si corriera antes, decidiría sobre netos del precio viejo.
      #
      # Va a `cyc/mlconfig/tgAlertas` y NO a la lista del resumen: ahí está el padre, y esto son
      # decisiones de precio que son de Mati. Si ese canal no está configurado NO manda nada y lo
      # dice en el log — el lado seguro acá es no mandar.
      #
      # NO TOCA NINGÚN PRECIO. El ":go" sólo quiere decir "mandá el mensaje".
      - name: Avisos de precio al canal privado
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BILLING_PROBE: avisos:go
        run: node ml-sync/sync.mjs
      # EL SUPERVISOR DE PRECIOS (23/09/2026). Pedido suyo: "si se modifica un producto quiero que
      # se evalúe cómo le fue en los próximos 7, 15 y 30 días". Saca la foto de los precios de hoy
      # (de lo que netoweb acaba de recalcular) para ver también los cambios a mano, y evalúa los
      # cambios que cumplieron 7/15/30 días: plata por día antes contra después. Avisa sólo lo nuevo.
      # NO TOCA NINGÚN PRECIO.
      - name: Supervisor de precios
        # si falla no se lleva puesto el resto del paso nocturno
        continue-on-error: true
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BILLING_PROBE: supervisor:go
        run: node ml-sync/sync.mjs

      # "PARA PROBAR": LA CUENTA DE ML DE LOS PRODUCTOS QUE TODAVÍA NO VENDEMOS (17/09/2026).
      #
      # El chat de Paraguay deja en la lista lo que encuentra en comprasparaguay (código, precio y
      # que Nissei lo ofrece). Este paso contesta lo único que falta: a cuánto se vende en ML y
      # cuánto queda. BUSCAR no lo puede hacer el robot —comprasparaguay le contesta 403— así que
      # el reparto es: el chat trae el dato, la cuenta la hace una sola parte, acá.
      #
      # Va DESPUÉS del aviso de precios: son mensajes distintos y el de precios es el importante.
      # Si la lista está vacía no hace nada y lo dice; si no hay ninguno nuevo que dé margen, no
      # manda ningún mensaje.
      #
      # NO COMPRA NADA NI TOCA NINGÚN PRECIO: sólo calcula y avisa.
      - name: Para probar · candidatos de Paraguay
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BILLING_PROBE: candidatos:go
        run: node ml-sync/sync.mjs

      # EL SALDO DE ML Y LA AGENDA DE LIBERACIONES (21/09/2026).
      #
      # Calcula "A liquidar en ML" del Arqueo y la agenda de cuánta plata se libera cada día, que
      # es lo que contesta *"¿cuánto va a haber disponible mañana?"*.
      #
      # POR QUÉ ESTÁ ACÁ Y NO SE CORRE A MANO, que es el motivo por el que se agregó: hasta hoy
      # `saldoml` sólo existía adentro de `BILLING_PROBE`, o sea que la agenda se actualizaba
      # ÚNICAMENTE cuando alguien lo disparaba — y cada corrida a mano MATA el ciclo de 2 minutos
      # del robot. O sea que el estado NORMAL de ese número era estar viejo, y un número viejo en
      # una pantalla de plata es peor que no tenerlo. Acá se refresca solo todas las noches.
      #
      # LOS DOS FRENOS SIGUEN ADENTRO DEL COMANDO: si falta una cuenta o la cuenta no cierra contra
      # las ventas, NO pisa lo que él tiene cargado. Y sin tipo de cambio no escribe nada, porque
      # el Arqueo está en dólares y el reporte viene en pesos.
      #
      # NO MUEVE UN PESO, NO TOCA ML Y NO TOCA NINGÚN PRECIO. Y no imprime montos: el registro es
      # público.
      - name: Saldo a liquidar y agenda de liberaciones
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BILLING_PROBE: saldoml:go
        run: node ml-sync/sync.mjs

      # EL DISPONIBLE, JUSTO DESPUÉS (24/09/2026, error m01 de la revisión del patrimonio).
      # `saldoml` saca de "A liquidar" lo que ML ya liberó, y hasta hoy NADIE lo sumaba al disponible
      # (que sólo se escribía a mano): esa plata desaparecía del patrimonio todas las noches. `dispo`
      # usa el MISMO corte de "hoy" y suma al disponible todo lo posterior al número que él cargó.
      # Si no cargó el disponible de las 4 cuentas, no toca nada (lo dice en el log).
      - name: Disponible de ML (lo liberado pasa de "a liquidar" al disponible)
        continue-on-error: true
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}
          BILLING_PROBE: dispo:go
        run: node ml-sync/sync.mjs

      # (El almacenamiento Full y los cargos de ML por débito —IIBB, etc.— ya NO se cargan como gasto
      # mensual: ahora se descuentan como un % por cuenta sobre cada venta, en la web. Ver ML_EXTRA_PCT.)
